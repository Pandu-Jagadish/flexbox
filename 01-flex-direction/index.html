<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flex Direction Options</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h2>1. flex-direction: row (Default - Left to Right)</h2>
    <div class="container dir-row">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>

    <h2>2. flex-direction: row-reverse (Right to Left)</h2>
    <div class="container dir-row-reverse">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>

    <h2>3. flex-direction: column (Top to Bottom)</h2>
    <div class="container dir-column">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>

    <h2>4. flex-direction: column-reverse (Bottom to Top)</h2>
    <div class="container dir-column-reverse">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>
  </body>
</html>
