<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Align Content Deep Dive</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h2>1. align-content: center (All rows packed in the middle)</h2>
    <div class="container content-center">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
      <div class="box">Box 4</div>
    </div>

    <h2>2. align-content: space-between (Rows pushed to top and bottom)</h2>
    <div class="container content-space-between">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
      <div class="box">Box 4</div>
    </div>
  </body>
</html>
