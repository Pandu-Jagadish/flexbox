<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Align Items Options</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h2>1. align-items: stretch (Default - Fills total height)</h2>
    <div class="container ai-stretch">
      <div class="box no-height">1 (No Height)</div>
      <div class="box no-height">2 (No Height)</div>
    </div>

    <h2>2. align-items: flex-start (Top)</h2>
    <div class="container ai-start">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>

    <h2>3. align-items: center (Middle)</h2>
    <div class="container ai-center">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>

    <h2>4. align-items: flex-end (Bottom)</h2>
    <div class="container ai-end">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>

    <h2>5. align-items: baseline (Aligned by text baseline)</h2>
    <div class="container ai-baseline">
      <div class="box font-small">Small</div>
      <div class="box font-large">LARGE</div>
    </div>
  </body>
</html>
