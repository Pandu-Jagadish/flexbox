<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flex Wrap Options</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h2>1. flex-wrap: nowrap (Default - Squeezes onto one line)</h2>
    <div class="container wrap-nowrap">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
      <div class="box">Box 4</div>
      <div class="box">Box 5</div>
      <div class="box">Box 6</div>
    </div>

    <h2>2. flex-wrap: wrap (Wraps downwards when space runs out)</h2>
    <div class="container wrap-wrap">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
      <div class="box">Box 4</div>
      <div class="box">Box 5</div>
      <div class="box">Box 6</div>
    </div>

    <h2>3. flex-wrap: wrap-reverse (Wraps upwards)</h2>
    <div class="container wrap-reverse">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
      <div class="box">Box 4</div>
      <div class="box">Box 5</div>
      <div class="box">Box 6</div>
    </div>
  </body>
</html>
