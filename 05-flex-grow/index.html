<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flex Grow Options</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h2>1. flex-grow: 0 (Default - Leaves extra space empty)</h2>
    <div class="container">
      <div class="box grow-0">grow: 0</div>
      <div class="box grow-0">grow: 0</div>
    </div>

    <h2>2. flex-grow: 1 (All items grow equally to fill full width)</h2>
    <div class="container">
      <div class="box grow-1">grow: 1</div>
      <div class="box grow-1">grow: 1</div>
    </div>

    <h2>3. Proportional Growth (Box 2 gets twice as much leftover space)</h2>
    <div class="container">
      <div class="box grow-1">grow: 1</div>
      <div class="box grow-2">grow: 2</div>
      <div class="box grow-1">grow: 1</div>
    </div>
  </body>
</html>
