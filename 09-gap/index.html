<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flexbox Gap Concepts</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h2>1. Single Gap (gap: 20px)</h2>
    <div class="container gap-equal">
      <div class="box">Item 1</div>
      <div class="box">Item 2</div>
      <div class="box">Item 3</div>
      <div class="box">Item 4</div>
    </div>

    <h2>2. Split Gap (gap: 30px 10px -> Row 30px, Column 10px)</h2>
    <div class="container gap-custom">
      <div class="box">Item 1</div>
      <div class="box">Item 2</div>
      <div class="box">Item 3</div>
      <div class="box">Item 4</div>
    </div>
  </body>
</html>
